<!doctype html>
<html>
  <head>
    <title>Images</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <h1>Images</h1>
    <p>
      This page covers common image formats, but you may also be looking for
      <a href="links.html">links</a> and
      <a href="misc/extras.html">useful extras</a>.
    </p>
    <h2>JPGs</h2>

    <p>JPG images are good for photos.</p>

    <img
      src="images/mochi.jpg"
      alt="A round mochi dessert with a smooth, pale exterior sitting on a white surface against a neutral background"
      width="75"
    />
    <h2>GIFs</h2>

    <p>GIFs are good for animations.</p>

    <img
      src="images/mochi.gif"
      alt="An animated GIF of a mochi dessert rotating slowly, showing its smooth, pale exterior from multiple angles on a white surface against a neutral background"
      width="75"
    />

    <h2>PNGs</h2>

    <p>PNGs are good for diagrams and icons.</p>

    <img
      src="images/mochi.png"
      alt="A round mochi dessert with a smooth, pale exterior and a soft pink center sitting on a white surface against a neutral background"
      width="75"
    />

    <h2>SVGs</h2>

    <p>SVGs are <em>amazing</em>. Use them wherever you can.</p>

    <img
      src="images/mochi.svg"
      alt="A simple SVG of a mochi dessert"
      width="75"
    />
  </body>
</html>
